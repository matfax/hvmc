name: CodeQL
# Analyzes pull requests, merge groups, pushes to main, and the default branch weekly, so new
# queries also reach code that doesn't change. The analysis lives in _codeql.yml of
# actions-fyi/shared-workflows; see there. CodeQL's default setup must be off in every repository
# this runs in, or code scanning rejects the upload.
#
# Unlike the other pull request checks, this isn't an org ruleset workflow: GitHub doesn't allow
# github/codeql-action in a required workflow. The org ruleset enforces it with "Require code
# scanning results" instead, and a merge queue waits for those results, so this also runs on
# merge_group.
on:
  pull_request:
  merge_group:
  push:
    branches: ["main"]
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

jobs:
  codeql:
    name: CodeQL
    # The union of what the jobs of _codeql.yml declare; a called job can't get more.
    permissions:
      contents: read # Read the repository's languages and check it out
      security-events: write # Upload the results to code scanning
      actions: read # Let CodeQL read the workflow run
    uses: actions-fyi/shared-workflows/.github/workflows/_codeql.yml@v0.15.1
