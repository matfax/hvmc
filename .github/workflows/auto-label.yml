name: Triage
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  triage:
    name: Triage
    cache-mode: none
    # The union of what the jobs of _triage.yml declare; a called job can't get more.
    permissions:
      contents: read # Check out the default branch
      id-token: write # Log in to OpenBao for Prompt Guard
      issues: write # Read the repository's labels, label issues, and escalate a flagged one
      pull-requests: write # Declared by Prompt Guard's shared workflow, unused on issues
    uses: actions-fyi/shared-workflows/.github/workflows/_triage.yml@v0.15.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PROMPT_GUARD_CLIENT_ID: ${{ secrets.PROMPT_GUARD_CLIENT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
